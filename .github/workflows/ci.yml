name: CI

on:
  pull_request:
    branches: [production-v1, main]
  push:
    branches: [production-v1]
  workflow_dispatch:

jobs:
  build-and-check:
    name: Build, Lint, Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # Runs `npm audit --audit-level=high` exactly as before — the global
      # threshold is not lowered and the step is not skipped. The wrapper
      # script only permits five specific, pre-documented advisory IDs
      # (matched primarily by public GHSA ID, with npm's internal advisory
      # `source` numbers kept only as a documented fallback — see the
      # script's own header comment) to pass; every other high/critical
      # finding still fails the build. Each allowed ID is tied to a dated
      # entry in docs/DECISIONS.md ("Sprint 3 CI: npm audit exceptions")
      # explaining why it's currently unreachable in this app and why no
      # non-breaking fix exists today, plus the condition that must
      # trigger re-evaluation (a Next.js upgrade, an ESLint major
      # bump, or next/image being introduced anywhere in the codebase).
      - name: Audit dependencies (scoped exceptions — see docs/DECISIONS.md)
        run: node .github/scripts/check-npm-audit.mjs

      - name: Run tests (if present)
        run: npm run test --if-present

      # Two independent gates keep this green until Neon is actually
      # provisioned: the schema must exist (PR 2+) AND DIRECT_URL must be a
      # real secret (set once Neon is provisioned). Either being absent is
      # an expected, informational skip — not a failure — so production-v1
      # never sits in a state where CI is expected to fail because external
      # infrastructure hasn't been set up yet. Once both are present, this
      # step runs for real.
      - name: Prisma migrate diff against preview branch (Phase 1+)
        run: |
          if [ ! -f prisma/schema.prisma ]; then
            echo "No prisma/schema.prisma yet — skipping. This step is a placeholder, not a failure."
            exit 0
          fi
          if [ -z "$DIRECT_URL" ]; then
            echo "prisma/schema.prisma exists, but DIRECT_URL isn't configured yet (Neon not provisioned) — skipping migrate diff until the database is set up. This is expected, not a failure."
            exit 0
          fi
          echo "prisma/schema.prisma detected and DIRECT_URL is configured — running migrate diff against the preview branch."
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$DIRECT_URL" \
            --exit-code
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  deploy-migrations:
    name: Deploy migrations (production)
    needs: build-and-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/production-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Same double-gate pattern as the migrate-diff step above: schema
      # file presence AND a real DATABASE_URL secret (the scoped migration
      # role's credential) must both hold before this runs for real.
      # Either being absent is an expected, informational skip.
      - name: Prisma migrate deploy (Phase 1+)
        run: |
          if [ ! -f prisma/schema.prisma ]; then
            echo "No prisma/schema.prisma yet — skipping. This step is a placeholder, not a failure."
            exit 0
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "prisma/schema.prisma exists, but the migration role's DATABASE_URL isn't configured yet (Neon not provisioned) — skipping migrate deploy until the database is set up. This is expected, not a failure."
            exit 0
          fi
          echo "prisma/schema.prisma detected and DATABASE_URL is configured — deploying migrations under the scoped migration role."
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
